<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </radialGradient>
    <radialGradient id="petalPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#EC4899" />
    </radialGradient>
    <radialGradient id="centerYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FDE047" />
    </radialGradient>
  </defs>
  <!-- Background circle with gentle sky blue -->
  <circle cx="64" cy="64" r="62" fill="#BAE6FD" stroke="#38BDF8" stroke-width="4"/>
  <!-- Gentle sun rays / sparkles -->
  <g fill="#FDE047" opacity="0.8">
    <circle cx="24" cy="24" r="4" />
    <circle cx="104" cy="24" r="5" />
    <circle cx="110" cy="80" r="3" />
    <circle cx="18" cy="85" r="3" />
  </g>
  <!-- Flower Stem and leaf -->
  <path d="M64 68 C64 92 64 104 64 116" stroke="#4ADE80" stroke-width="8" stroke-linecap="round"/>
  <path d="M64 92 Q80 84 86 94 Q76 104 64 98" fill="#4ADE80"/>
  <path d="M64 82 Q48 76 42 86 Q52 96 64 88" fill="#4ADE80"/>
  
  <!-- Flower Petals (Rainbow petals!) -->
  <circle cx="64" cy="36" r="16" fill="#F87171"/>
  <circle cx="84" cy="46" r="16" fill="#FB923C"/>
  <circle cx="88" cy="70" r="16" fill="#FACC15"/>
  <circle cx="74" cy="90" r="16" fill="#4ADE80"/>
  <circle cx="54" cy="90" r="16" fill="#38BDF8"/>
  <circle cx="40" cy="70" r="16" fill="#818CF8"/>
  <circle cx="44" cy="46" r="16" fill="#C084FC"/>

  <!-- Flower Center -->
  <circle cx="64" cy="64" r="20" fill="url(#centerYellow)" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Happy Face -->
  <ellipse cx="57" cy="61" rx="2.5" ry="4" fill="#374151"/>
  <ellipse cx="71" cy="61" rx="2.5" ry="4" fill="#374151"/>
  <circle cx="56" cy="59" r="1" fill="#FFFFFF"/>
  <circle cx="70" cy="59" r="1" fill="#FFFFFF"/>
  <!-- Rosy cheeks -->
  <circle cx="52" cy="67" r="3" fill="#F472B6" opacity="0.6"/>
  <circle cx="76" cy="67" r="3" fill="#F472B6" opacity="0.6"/>
  <!-- Smile -->
  <path d="M58 67 Q64 74 70 67" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
